name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    # EnergyPlus validation tests skip automatically when EnergyPlus is not installed.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --group dev pytest -q
