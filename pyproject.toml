[project]
name = "pdf-energyplus"
version = "0.1.0"
description = "Development harness (tests) for the pdf-energyplus Claude Code skill"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "shapely>=2.0",
  "pdfplumber>=0.11",
  "pypdfium2>=4.30",
  "pillow>=10",
]

[dependency-groups]
dev = ["pytest>=8", "matplotlib>=3.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["engines: needs EnergyPlus installed (found via PDF2EPJSON_ENERGYPLUS, PATH or the default install folder)"]

[tool.uv]
package = false
